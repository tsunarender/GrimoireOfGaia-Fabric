plugins {
    id 'fabric-loom' version '1.10.5'
    id 'maven-publish'
}

version = project.mod_version
group = project.maven_group

base {
    archivesName = project.archives_base_name
}

repositories {
    mavenCentral()
    maven { url = "https://maven.terraformersmc.com/releases/" }
    maven { url = "https://maven.ladysnake.org/releases" }
}

dependencies {
    minecraft "com.mojang:minecraft:${project.minecraft_version}"
    mappings loom.officialMojangMappings()
    modImplementation "net.fabricmc:fabric-loader:${project.loader_version}"
    modImplementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_api_version}"
    modCompileOnly "dev.emi:trinkets:3.10.0"
}

def upstreamZip = layout.buildDirectory.file("upstream/gaia-1.21.zip")
def upstreamRoot = layout.buildDirectory.dir("upstream/source")
def portedRoot = layout.buildDirectory.dir("ported")

tasks.register("prepareUpstream") {
    outputs.dir(portedRoot)
    doLast {
        def zipFile = upstreamZip.get().asFile
        def extractDir = upstreamRoot.get().asFile
        zipFile.parentFile.mkdirs()
        extractDir.mkdirs()

        if (!zipFile.exists()) {
            new URL("https://codeload.github.com/Silentine/GrimoireOfGaia/zip/93f503372490aaf1fb041eb6f33304d6a26add1d").withInputStream { input ->
                zipFile.withOutputStream { output -> output << input }
            }
        }

        def sourceRoot = extractDir.listFiles()?.find { it.isDirectory() && it.name.startsWith("GrimoireOfGaia-") }
        if (sourceRoot == null) {
            copy { from zipTree(zipFile); into extractDir }
            sourceRoot = extractDir.listFiles()?.find { it.isDirectory() && it.name.startsWith("GrimoireOfGaia-") }
        }
        if (sourceRoot == null || !new File(sourceRoot, "src/main").exists()) {
            throw new GradleException("Could not locate upstream Grimoire of Gaia source in " + extractDir)
        }

        def destination = portedRoot.get().asFile
        delete destination
        destination.mkdirs()

        def excluded = [
            "src/main/java/gaia/GrimoireOfGaia.java",
            "src/main/java/gaia/attachment/AttachmentHandler.java",
            "src/main/java/gaia/registry/GaiaSpawning.java",
            "src/main/java/gaia/registry/GaiaDataSerializers.java",
            "src/main/java/gaia/registry/GaiaModifiers.java",
            "src/main/java/gaia/modifier/**",
            "src/main/java/gaia/handler/**",
            "src/main/java/gaia/compat/curios/**",
            "src/main/java/gaia/datagen/**",
            "src/main/java/gaia/client/ClientHandler.java"
        ]

        copy {
            from sourceRoot
            into destination
            exclude excluded
            exclude "src/main/resources/META-INF/neoforge.mods.toml"
            exclude "src/main/resources/META-INF/accesstransformer.cfg"
            exclude "src/main/resources/data/grimoireofgaia/neoforge/**"
        }

        // Overlay Fabric-specific sources before applying the compatibility rewrites,
        // so local Fabric sources are compiled from the prepared tree as well.
        copy { from project.file("src/main/java"); into new File(destination, "src/main/java") }

        fileTree(new File(destination, "src/main/java")).matching { include "**/*.java" }.files.each { f ->
            def s = f.getText("UTF-8")

            // NeoForge registry APIs -> self-contained Fabric compatibility.
            s = s.replace("net.neoforged.neoforge.registries.DeferredRegister", "gaia.fabric.compat.DeferredRegister")
            s = s.replace("net.neoforged.neoforge.registries.DeferredHolder", "gaia.fabric.compat.DeferredHolder")
            s = s.replace("net.neoforged.neoforge.registries.DeferredItem", "gaia.fabric.compat.DeferredItem")
            s = s.replace("net.neoforged.neoforge.registries.DeferredBlock", "gaia.fabric.compat.DeferredBlock")
            s = s.replace("net.neoforged.neoforge.common.DeferredSpawnEggItem", "gaia.fabric.compat.DeferredSpawnEggItem")
            s = s.replace("net.neoforged.neoforge.common.SimpleTier", "gaia.fabric.compat.SimpleTier")
            s = s.replace("net.neoforged.neoforge.common.Tags", "gaia.fabric.compat.Tags")
            s = s.replace("net.neoforged.neoforge.event.EventHooks", "gaia.fabric.compat.EntityHooks")
            s = s.replace("net.neoforged.neoforge.event.entity.EntityTeleportEvent", "gaia.fabric.compat.EntityTeleportEvent")

            // Vanilla/Fabric replacements for small NeoForge hooks.
            s = s.replace("import net.neoforged.neoforge.common.ItemAbilities;\\n", "")
            s = s.replace(".canPerformAction(ItemAbilities.SHIELD_BLOCK)", ".is(net.minecraft.world.item.Items.SHIELD)")
            s = s.replace("import net.neoforged.neoforge.fluids.FluidType;\\n", "")
            s = s.replace("isPushedByFluid(FluidType type)", "isPushedByFluid()")
            s = s.replace("import net.neoforged.neoforge.items.ItemHandlerHelper;\\n", "")
            s = s.replace("ItemHandlerHelper.giveItemToPlayer(player, lootStack)",
                          "player.getInventory().placeItemBackInInventory(lootStack)")

            // Server hooks with direct vanilla equivalents.
            s = s.replace("EventHooks.canEntityGrief(this.level(), this)",
                          "this.level().getGameRules().getBoolean(net.minecraft.world.level.GameRules.RULE_MOBGRIEFING)")
            s = s.replace("EventHooks.finalizeMobSpawn(mite, (ServerLevel) this.level(), this.level().getCurrentDifficultyAt(blockpos), MobSpawnType.MOB_SUMMONED, (SpawnGroupData) null)",
                          "mite.finalizeSpawn((ServerLevel) this.level(), this.level().getCurrentDifficultyAt(blockpos), MobSpawnType.MOB_SUMMONED, null)")
            s = s.replace("EventHooks.finalizeMobSpawn(monster, (ServerLevel) this.level(), this.level().getCurrentDifficultyAt(blockpos), MobSpawnType.MOB_SUMMONED, (SpawnGroupData) null)",
                          "monster.finalizeSpawn((ServerLevel) this.level(), this.level().getCurrentDifficultyAt(blockpos), MobSpawnType.MOB_SUMMONED, null)")

            // Optional-mod checks.
            s = s.replace("ModList.get().isLoaded(\"curios\")",
                          "net.fabricmc.loader.api.FabricLoader.getInstance().isModLoaded(\"trinkets\")")
            s = s.replace("ModList.get().isLoaded(\"patchouli\")",
                          "net.fabricmc.loader.api.FabricLoader.getInstance().isModLoaded(\"patchouli\")")

            // Remove NeoForge event annotations/imports from excluded handlers or passive classes.
            s = s.replace("import gaia.attachment.AttachmentHandler;\\n", "")
            s = s.replace("@SubscribeEvent", "")
            s = s.replace("@EventBusSubscriber", "")
            s = s.readLines().findAll { line -> !line.trim().startsWith("import net.neoforged.") }.join("\n")

            // Preserve summon state without NeoForge persistent data/attachments.
            if (f.name == "AbstractGaiaEntity.java") {
                s = s.replace("protected Goal targetPlayerGoal;",
                    "protected Goal targetPlayerGoal;\n\tprivate final Friended friendedData = new Friended();\n\tprivate boolean staffSummoned = false;\n\tprivate UUID staffSummoner = null;")
                s = s.replace("AttachmentHandler.getFriended(this)", "friendedData")
                s = s.replace('tag.putInt("Variant", getVariant());',
                    'tag.putInt("Variant", getVariant());\n\t\ttag.put("Friended", friendedData.serializeNBT());\n\t\ttag.putBoolean("StaffSummoned", staffSummoned);\n\t\tif (staffSummoner != null) tag.putUUID("StaffSummoner", staffSummoner);')
                s = s.replace('setVariant(variant);\n\t\t}\n\t\tsetupFriendGoals',
                    'setVariant(variant);\n\t\t}\n\t\tif (tag.contains("Friended")) friendedData.deserializeNBT(tag.getCompound("Friended"));\n\t\tstaffSummoned = tag.getBoolean("StaffSummoned");\n\t\tif (tag.contains("StaffSummoner")) staffSummoner = tag.getUUID("StaffSummoner");\n\t\tsetupFriendGoals')
                s = s.replace("\n\tpublic void onFriendlyChange(IFriended cap)",
                    "\n\tpublic boolean isStaffSummoned() { return staffSummoned; }\n\n\tpublic void setStaffSummoned(boolean value) { this.staffSummoned = value; }\n\n\t@Nullable\n\tpublic UUID getStaffSummoner() { return staffSummoner; }\n\n\tpublic void setStaffSummoner(@Nullable UUID value) { this.staffSummoner = value; }\n\n\tpublic void onFriendlyChange(IFriended cap)")
            }

            f.write(s, "UTF-8")
        }

        copy { from project.file("src/main/resources"); into new File(destination, "src/main/resources") }
        def quoteJavaString = { value ->
            '"' + value.toString().replace('\\', '\\\\').replace('"', '\\"') + '"'
        }

        def biomeModifierDir = new File(sourceRoot, "src/generated/resources/data/grimoireofgaia/neoforge/biome_modifier")
        // Provide Fabric-side definitions for the Common Tags used by Gaia's NeoForge biome JSONs.
        def commonBiomeTagValues = [
            "is_mushroom": ["minecraft:mushroom_fields"],
            "no_default_monsters": ["minecraft:mushroom_fields", "minecraft:deep_dark"],
            "is_sandy": ["minecraft:desert", "minecraft:badlands", "minecraft:wooded_badlands", "minecraft:eroded_badlands", "minecraft:beach"],
            "is_plateau": ["minecraft:wooded_badlands", "minecraft:savanna_plateau", "minecraft:cherry_grove", "minecraft:meadow"],
            "is_mountain": [
                "#minecraft:is_mountain",
                "minecraft:snowy_slopes", "minecraft:meadow", "minecraft:grove", "minecraft:cherry_grove",
                "minecraft:jagged_peaks", "minecraft:frozen_peaks", "minecraft:stony_peaks"
            ],
            "is_cold_overworld": [
                "minecraft:taiga", "minecraft:old_growth_pine_taiga", "minecraft:old_growth_spruce_taiga",
                "minecraft:windswept_hills", "minecraft:windswept_gravelly_hills", "minecraft:windswept_forest",
                "minecraft:snowy_plains", "minecraft:ice_spikes", "minecraft:grove", "minecraft:snowy_slopes",
                "minecraft:jagged_peaks", "minecraft:frozen_peaks", "minecraft:stony_shore", "minecraft:snowy_beach",
                "minecraft:snowy_taiga", "minecraft:frozen_river", "minecraft:cold_ocean", "minecraft:frozen_ocean",
                "minecraft:deep_cold_ocean", "minecraft:deep_frozen_ocean"
            ],
            "is_cold_end": ["minecraft:the_end", "minecraft:small_end_islands", "minecraft:end_midlands", "minecraft:end_highlands", "minecraft:end_barrens"],
            "is_dry_end": ["minecraft:the_end", "minecraft:small_end_islands", "minecraft:end_midlands", "minecraft:end_highlands", "minecraft:end_barrens"],
            "is_cold": [
                "minecraft:taiga", "minecraft:old_growth_pine_taiga", "minecraft:old_growth_spruce_taiga",
                "minecraft:windswept_hills", "minecraft:windswept_gravelly_hills", "minecraft:windswept_forest",
                "minecraft:snowy_plains", "minecraft:ice_spikes", "minecraft:grove", "minecraft:snowy_slopes",
                "minecraft:jagged_peaks", "minecraft:frozen_peaks", "minecraft:stony_shore", "minecraft:snowy_beach",
                "minecraft:snowy_taiga", "minecraft:frozen_river", "minecraft:cold_ocean", "minecraft:frozen_ocean",
                "minecraft:deep_cold_ocean", "minecraft:deep_frozen_ocean",
                "minecraft:the_end", "minecraft:small_end_islands", "minecraft:end_midlands", "minecraft:end_highlands", "minecraft:end_barrens"
            ],
            "is_hot_overworld": [
                "minecraft:jungle", "minecraft:bamboo_jungle", "minecraft:sparse_jungle", "minecraft:desert",
                "minecraft:badlands", "minecraft:wooded_badlands", "minecraft:eroded_badlands", "minecraft:savanna",
                "minecraft:savanna_plateau", "minecraft:windswept_savanna", "minecraft:stony_peaks",
                "minecraft:mushroom_fields", "minecraft:warm_ocean"
            ],
            "is_hot": [
                "minecraft:jungle", "minecraft:bamboo_jungle", "minecraft:sparse_jungle", "minecraft:desert",
                "minecraft:badlands", "minecraft:wooded_badlands", "minecraft:eroded_badlands", "minecraft:savanna",
                "minecraft:savanna_plateau", "minecraft:windswept_savanna", "minecraft:stony_peaks",
                "minecraft:mushroom_fields", "minecraft:warm_ocean",
                "minecraft:nether_wastes", "minecraft:crimson_forest", "minecraft:warped_forest",
                "minecraft:soul_sand_valley", "minecraft:basalt_deltas"
            ],
            "is_sparse_vegetation": [
                "minecraft:wooded_badlands", "minecraft:savanna", "minecraft:savanna_plateau",
                "minecraft:sparse_jungle", "minecraft:windswept_savanna", "minecraft:windswept_forest",
                "minecraft:windswept_hills", "minecraft:windswept_gravelly_hills", "minecraft:snowy_slopes",
                "minecraft:jagged_peaks", "minecraft:frozen_peaks"
            ],
            "is_dense_vegetation": [
                "minecraft:dark_forest", "minecraft:old_growth_birch_forest", "minecraft:old_growth_spruce_taiga",
                "minecraft:jungle", "minecraft:bamboo_jungle", "minecraft:mangrove_swamp"
            ],
            "is_coniferous_tree": ["#minecraft:is_taiga", "minecraft:grove"],
            "is_snowy": [
                "minecraft:snowy_beach", "minecraft:snowy_plains", "minecraft:ice_spikes", "minecraft:snowy_taiga",
                "minecraft:grove", "minecraft:snowy_slopes", "minecraft:jagged_peaks", "minecraft:frozen_peaks"
            ],
            "is_cold_overworld": [
                "minecraft:taiga", "minecraft:old_growth_pine_taiga", "minecraft:old_growth_spruce_taiga",
                "minecraft:windswept_hills", "minecraft:windswept_gravelly_hills", "minecraft:windswept_forest",
                "minecraft:snowy_plains", "minecraft:ice_spikes", "minecraft:grove", "minecraft:snowy_slopes",
                "minecraft:jagged_peaks", "minecraft:frozen_peaks", "minecraft:stony_shore", "minecraft:snowy_beach",
                "minecraft:snowy_taiga", "minecraft:frozen_river", "minecraft:cold_ocean", "minecraft:frozen_ocean",
                "minecraft:deep_cold_ocean", "minecraft:deep_frozen_ocean"
            ],
            "is_hot_overworld": [
                "minecraft:jungle", "minecraft:bamboo_jungle", "minecraft:sparse_jungle", "minecraft:desert",
                "minecraft:badlands", "minecraft:wooded_badlands", "minecraft:eroded_badlands", "minecraft:savanna",
                "minecraft:savanna_plateau", "minecraft:windswept_savanna", "minecraft:stony_peaks",
                "minecraft:mushroom_fields", "minecraft:warm_ocean"
            ],
            "is_aquatic": [
                "#minecraft:is_ocean", "#minecraft:is_river"
            ],
            "is_swamp": ["minecraft:swamp", "minecraft:mangrove_swamp"],
            "is_spooky": ["minecraft:dark_forest", "minecraft:pale_garden", "minecraft:deep_dark"],
            "is_plains": ["minecraft:plains", "minecraft:sunflower_plains"],
            "is_rare": [
                "minecraft:sunflower_plains", "minecraft:flower_forest", "minecraft:old_growth_birch_forest",
                "minecraft:old_growth_spruce_taiga", "minecraft:bamboo_jungle", "minecraft:sparse_jungle",
                "minecraft:eroded_badlands", "minecraft:savanna_plateau", "minecraft:windswept_savanna",
                "minecraft:ice_spikes", "minecraft:windswept_gravelly_hills", "minecraft:pale_garden",
                "minecraft:mushroom_fields", "minecraft:deep_dark"
            ]
        ]

        def usedCommonTags = [] as Set
        if (biomeModifierDir.exists()) {
            biomeModifierDir.eachFileMatch(~/.*\.json/) { jsonFile ->
                def json = new groovy.json.JsonSlurper().parse(jsonFile)
                ((json.whitelist ?: []) + (json.blacklist ?: [])).each { raw ->
                    def value = raw.toString()
                    if (value.startsWith("#c:")) usedCommonTags << value.substring(3)
                }
            }
        }

        usedCommonTags.each { tagPath ->
            def values = commonBiomeTagValues[tagPath]
            if (values != null) {
                def tagFile = new File(destination, "src/main/resources/data/c/tags/worldgen/biome/" + tagPath + ".json")
                tagFile.parentFile.mkdirs()
                tagFile.write(groovy.json.JsonOutput.toJson([replace:false, values:values]), "UTF-8")
            }
        }

        copy {
            from new File(sourceRoot, "src/generated/resources")
            into new File(destination, "src/generated/resources")
            exclude "data/grimoireofgaia/neoforge/**"
        }
    }
}

sourceSets {
    main {
        java { setSrcDirs([new File(portedRoot.get().asFile, "src/main/java")]) }
        resources {
            srcDirs = [new File(portedRoot.get().asFile, "src/main/resources"), new File(portedRoot.get().asFile, "src/generated/resources")]
        }
    }
}

tasks.named("compileJava").configure { dependsOn tasks.named("prepareUpstream") }
tasks.named("processResources").configure {
    dependsOn tasks.named("prepareUpstream")
    duplicatesStrategy = DuplicatesStrategy.EXCLUDE
    filesMatching("fabric.mod.json") { expand(version: project.version) }
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = "UTF-8"
    options.release = 21
}

publishing {
    publications {
        mavenJava(MavenPublication) {
            from components.java
        }
    }
}
