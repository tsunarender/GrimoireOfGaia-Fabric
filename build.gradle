plugins {
    id 'fabric-loom' version '1.10.5'
    id 'maven-publish'
}

version = project.mod_version
group = project.maven_group

base { archivesName = project.archives_base_name }

repositories {
    mavenCentral()
    maven { url = "https://mvn.devos.one/releases/" }
}

dependencies {
    minecraft "com.mojang:minecraft:${project.minecraft_version}"
    mappings loom.officialMojangMappings()
    modImplementation "net.fabricmc:fabric-loader:${project.loader_version}"
    modImplementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_api_version}"

    modImplementation(include("io.github.fabricators_of_create.Porting-Lib:base:${project.porting_lib_version}"))
    modImplementation(include("io.github.fabricators_of_create.Porting-Lib:common:${project.porting_lib_version}"))
    modImplementation(include("io.github.fabricators_of_create.Porting-Lib:registry:${project.porting_lib_version}"))
    modImplementation(include("io.github.fabricators_of_create.Porting-Lib:attributes:${project.porting_lib_version}"))
    modImplementation(include("io.github.fabricators_of_create.Porting-Lib:config:${project.porting_lib_version}"))
    modImplementation(include("io.github.fabricators_of_create.Porting-Lib:entity:${project.porting_lib_version}"))
    modImplementation(include("io.github.fabricators_of_create.Porting-Lib:fluids:${project.porting_lib_version}"))
    modImplementation(include("io.github.fabricators_of_create.Porting-Lib:item_abilities:${project.porting_lib_version}"))
    modImplementation(include("io.github.fabricators_of_create.Porting-Lib:tags:${project.porting_lib_version}"))
}

def upstreamZip = layout.buildDirectory.file("upstream/gaia-1.21.zip")
def upstreamRoot = layout.buildDirectory.dir("upstream/source")
def portedRoot = layout.buildDirectory.dir("ported")

tasks.register("prepareUpstream") {
    outputs.dir(portedRoot)
    doLast {
        def zipFile = upstreamZip.get().asFile
        def extractDir = upstreamRoot.get().asFile
        zipFile.parentFile.mkdirs()
        extractDir.mkdirs()

        if (!zipFile.exists()) {
            new URL("https://codeload.github.com/Silentine/GrimoireOfGaia/zip/93f503372490aaf1fb041eb6f33304d6a26add1d").withInputStream { input ->
                zipFile.withOutputStream { output -> output << input }
            }
        }

        def sourceRoot = new File(extractDir, "GrimoireOfGaia-1.21")
        if (!sourceRoot.exists()) {
            copy { from zipTree(zipFile); into extractDir }
        }

        def destination = portedRoot.get().asFile
        delete destination
        destination.mkdirs()

        def excluded = [
            "src/main/java/gaia/GrimoireOfGaia.java",
            "src/main/java/gaia/attachment/AttachmentHandler.java",
            "src/main/java/gaia/registry/GaiaSpawning.java",
            "src/main/java/gaia/registry/GaiaDataSerializers.java",
            "src/main/java/gaia/registry/GaiaModifiers.java",
            "src/main/java/gaia/modifier/**",
            "src/main/java/gaia/handler/**",
            "src/main/java/gaia/compat/curios/**",
            "src/main/java/gaia/datagen/**",
            "src/main/java/gaia/client/ClientHandler.java"
        ]

        copy {
            from sourceRoot
            into destination
            exclude excluded
            exclude "src/main/resources/META-INF/neoforge.mods.toml"
            exclude "src/main/resources/META-INF/accesstransformer.cfg"
            exclude "src/main/resources/data/grimoireofgaia/neoforge/**"
        }

        fileTree(new File(destination, "src/main/java")).matching { include "**/*.java" }.files.each { f ->
            def s = f.getText("UTF-8")

            s = s.replace("net.neoforged.neoforge.registries.DeferredRegister", "io.github.fabricators_of_create.porting_lib.registry.DeferredRegister")
            s = s.replace("net.neoforged.neoforge.registries.DeferredHolder", "io.github.fabricators_of_create.porting_lib.registry.DeferredHolder")
            s = s.replace("net.neoforged.neoforge.registries.DeferredItem", "io.github.fabricators_of_create.porting_lib.registry.DeferredItem")
            s = s.replace("net.neoforged.neoforge.registries.DeferredBlock", "io.github.fabricators_of_create.porting_lib.registry.DeferredBlock")
            s = s.replace("net.neoforged.neoforge.common.DeferredSpawnEggItem", "io.github.fabricators_of_create.porting_lib.util.DeferredSpawnEggItem")
            s = s.replace("net.neoforged.neoforge.common.SimpleTier", "io.github.fabricators_of_create.porting_lib.common.util.SimpleTier")
            s = s.replace("net.neoforged.neoforge.common.ItemAbilities", "io.github.fabricators_of_create.porting_lib.tool.ItemAbilities")
            s = s.replace("net.neoforged.neoforge.common.Tags", "io.github.fabricators_of_create.porting_lib.tags.Tags")
            s = s.replace("net.neoforged.neoforge.fluids.FluidType", "io.github.fabricators_of_create.porting_lib.fluids.FluidType")
            s = s.replace("net.neoforged.neoforge.event.EventHooks", "io.github.fabricators_of_create.porting_lib.entity.EntityHooks")
            s = s.replace("EventHooks.onEnderTeleport", "EntityHooks.onEnderTeleport")

            s = s.replace("EventHooks.canEntityGrief(this.level(), this)",
                "this.level().getGameRules().getBoolean(net.minecraft.world.level.GameRules.RULE_MOBGRIEFING)")
            s = s.replace("EventHooks.finalizeMobSpawn(mite, (ServerLevel) this.level(), this.level().getCurrentDifficultyAt(blockpos), MobSpawnType.MOB_SUMMONED, (SpawnGroupData) null)",
                "mite.finalizeSpawn((ServerLevel) this.level(), this.level().getCurrentDifficultyAt(blockpos), MobSpawnType.MOB_SUMMONED, null)")
            s = s.replace("EventHooks.finalizeMobSpawn(monster, (ServerLevel) this.level(), this.level().getCurrentDifficultyAt(blockpos), MobSpawnType.MOB_SUMMONED, (SpawnGroupData) null)",
                "monster.finalizeSpawn((ServerLevel) this.level(), this.level().getCurrentDifficultyAt(blockpos), MobSpawnType.MOB_SUMMONED, null)")

            s = s.replace("ItemHandlerHelper.giveItemToPlayer(player, lootStack)",
                "player.getInventory().placeItemBackInInventory(lootStack)")

            // Port NeoForge entity attachments/persistent summon markers to entity-owned state.
            if (f.name == "AbstractGaiaEntity.java") {
                s = s.replace("import gaia.attachment.AttachmentHandler;\n", "");
                s = s.replace("protected Goal targetPlayerGoal;",
                    "private Goal targetPlayerGoal;\n\tprivate final Friended friendedData = new Friended();\n\tprivate boolean staffSummoned = false;\n\tprivate UUID staffSummoner = null;");
                s = s.replace("AttachmentHandler.getFriended(this)", "friendedData");
                s = s.replace('tag.putInt("Variant", getVariant());',
                    'tag.putInt("Variant", getVariant());\n\t\ttag.put("Friended", friendedData.serializeNBT());\n\t\ttag.putBoolean("StaffSummoned", staffSummoned);\n\t\tif (staffSummoner != null) tag.putUUID("StaffSummoner", staffSummoner);');
                s = s.replace("setVariant(variant);\n\t\t}\n\t\tsetupFriendGoals",
                    'setVariant(variant);\n\t\t}\n\t\tif (tag.contains("Friended")) friendedData.deserializeNBT(tag.getCompound("Friended"));\n\t\tstaffSummoned = tag.getBoolean("StaffSummoned");\n\t\tif (tag.contains("StaffSummoner")) staffSummoner = tag.getUUID("StaffSummoner");\n\t\tsetupFriendGoals');
                s = s.replace("\n\tpublic void onFriendlyChange(IFriended cap)",
                    "\n\tpublic boolean isStaffSummoned() { return staffSummoned; }\n\n\tpublic void setStaffSummoned(boolean value) { this.staffSummoned = value; }\n\n\t@Nullable\n\tpublic UUID getStaffSummoner() { return staffSummoner; }\n\n\tpublic void setStaffSummoner(@Nullable UUID value) { this.staffSummoner = value; }\n\n\tpublic void onFriendlyChange(IFriended cap)");
            }

            if (f.name == "SummonStaffItem.java") {
                s = s.replace("import gaia.Reference;\n", "");
                s = s.replace("import net.minecraft.nbt.CompoundTag;\n", "");
                s = s.replace("import net.neoforged.neoforge.event.EventHooks;\n", "");
                s = s.replace("import net.minecraft.world.entity.Mob;\n",
                    "import net.minecraft.world.entity.Mob;\nimport gaia.entity.AbstractGaiaEntity;\n");
                s = s.replace(
                    "EventHooks.finalizeMobSpawn(summon, (ServerLevel) level, level.getCurrentDifficultyAt(spawnPos), MobSpawnType.MOB_SUMMONED, (SpawnGroupData) null);",
                    "summon.finalizeSpawn((ServerLevel) level, level.getCurrentDifficultyAt(spawnPos), MobSpawnType.MOB_SUMMONED, null);");
                s = s.replace(
                    "CompoundTag tag = summon.getPersistentData();\n\t\t\ttag.putBoolean(Reference.SUMMONED_TAG, true);\n\t\t\ttag.putUUID(Reference.SUMMONER_TAG, livingEntity.getUUID());",
                    "if (summon instanceof AbstractGaiaEntity gaiaSummon) {\n\t\t\t\tgaiaSummon.setStaffSummoned(true);\n\t\t\t\tgaiaSummon.setStaffSummoner(livingEntity.getUUID());\n\t\t\t}");
                s = s.replace(
                    "!tag.contains(Reference.SUMMONED_TAG)",
                    "!(summon instanceof AbstractGaiaEntity gaiaSummon && gaiaSummon.isStaffSummoned())");
            }

            // Client-side/NeoForge event annotations are replaced by explicit Fabric entrypoints.
            s = s.replace("import net.neoforged.bus.api.SubscribeEvent;\n", "")
            s = s.replace("import net.neoforged.fml.common.EventBusSubscriber;\n", "")
            s = s.replace("import net.neoforged.fml.ModList;\n", "")
            s = s.replace("ModList.get().isLoaded(\"curios\")", "net.fabricmc.loader.api.FabricLoader.getInstance().isModLoaded(\"trinkets\")")
            s = s.replace("ModList.get().isLoaded(\"patchouli\")", "net.fabricmc.loader.api.FabricLoader.getInstance().isModLoaded(\"patchouli\")")
            s = s.replace("import net.neoforged.fml.ModList;\r\n", "")

            // Remove remaining optional NeoForge-only imports where the associated feature is omitted on Fabric.
            s = s.replace("import net.neoforged.neoforge.common.ItemAbilities;\n", "")
            s = s.replace("import net.neoforged.neoforge.fluids.FluidType;\n", "")

            f.write(s, "UTF-8")
        }

        copy { from project.file("src/main/java"); into new File(destination, "src/main/java") }
        copy { from project.file("src/main/resources"); into new File(destination, "src/main/resources") }
        copy {
            from new File(sourceRoot, "src/generated/resources")
            into new File(destination, "src/generated/resources")
            exclude "data/grimoireofgaia/neoforge/**"
        }
    }
}

sourceSets {
    main {
        java { srcDir new File(portedRoot.get().asFile, "src/main/java") }
        resources {
            srcDir new File(portedRoot.get().asFile, "src/main/resources")
            srcDir new File(portedRoot.get().asFile, "src/generated/resources")
        }
    }
}

tasks.named("compileJava").configure { dependsOn tasks.named("prepareUpstream") }
tasks.named("processResources").configure {
    dependsOn tasks.named("prepareUpstream")
    duplicatesStrategy = DuplicatesStrategy.EXCLUDE
    filesMatching("fabric.mod.json") { expand(version: project.version) }
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = "UTF-8"
    options.release = 21
}

publishing {
    publications {
        mavenJava(MavenPublication) {
            from components.java
        }
    }
}
